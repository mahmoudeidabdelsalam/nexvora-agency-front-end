name: Deploy Next.js to Hostinger

on:
  push:
    branches:
      - main

  repository_dispatch:
    types:
      - wordpress_content_updated

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test WordPress GraphQL
        run: |
          echo "Testing WordPress GraphQL..."
          curl -sS --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"query":"{ generalSettings { title } }"}' \
            https://cms.nexvoraagency.com/graphql

      - name: Build Next.js static export
        run: npm run build
        env:
          WORDPRESS_GRAPHQL_URL: ${{ vars.WORDPRESS_GRAPHQL_URL }}
          WORDPRESS_MEDIA_HOSTNAME: ${{ vars.WORDPRESS_MEDIA_HOSTNAME }}
          NEXT_PUBLIC_WORDPRESS_URL: ${{ vars.NEXT_PUBLIC_WORDPRESS_URL }}

      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/service/index.html
          test -f out/blog/index.html

          echo "Service routes:"
          find out/service -maxdepth 2 -type f | sort

          echo "Blog routes:"
          find out/blog -maxdepth 2 -type f | sort

          echo "Static export verified successfully."

      - name: Check generated service routes
        run: |
          echo "================================"
          echo "Generated Service Routes"
          echo "================================"

          find out/service -mindepth 1 -maxdepth 2 -type f -name "index.html" | sort

          echo ""
          echo "================================"
          echo "Checking old slug"
          echo "================================"

          if [ -d "out/service/digital-markiting" ]; then
            echo "❌ OLD SLUG FOUND: digital-markiting"
            exit 1
          else
            echo "✅ Old slug not found"
          fi

          if [ -d "out/service/digital-marketing-advertising" ]; then
            echo "✅ New slug found"
          fi

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT }}

          local-dir: ./out/
          server-dir: ./

          state-name: .ftp-deploy-sync-state-v2.json

          dangerous-clean-slate: false

          exclude: |
            **/.DS_Store
            **/.git*
            **/.git*/**